x-php: &php-healthcheck
  test: ["CMD-SHELL", "curl -f http://localhost:2019/metrics || exit 1"]
  interval: 10s
  start_period: 60s
  start_interval: 1s

services:
  php:
    image: mossytrunk-dev
    build: .
    healthcheck: *php-healthcheck
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-app}?serverVersion=18&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
      CADDY_SERVER_EXTRA_DIRECTIVES: 'header /build/* Cache-Control "no-cache"'
    volumes:
      - ./:/app
    ports:
      - "${HTTP_PORT:-8080}:80"

  node:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run hot"
    environment:
      DEV_SERVER_PORT: ${DEV_SERVER_PORT:-8081}
    volumes:
      - ./:/app
    ports:
      - "${DEV_SERVER_PORT:-8081}:8081"

  playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [e2e]
    working_dir: /app/e2e
    environment:
      BASE_URL: http://php-e2e
      CI: ${CI:-}
      E2E_LANES: ${E2E_LANES:-1}
      MAILPIT_URL: http://mailpit:8025
    volumes:
      - ./:/app
    depends_on:
      - php-e2e
      - mailpit

  php-e2e:
    image: mossytrunk-dev
    build: .
    command: [frankenphp, run, --config, /app/docker/frankenphp/Caddyfile.e2e, --adapter, caddyfile]
    healthcheck: *php-healthcheck
    profiles: [e2e]
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: test
      APP_DEBUG: 0
      E2E_NATIVE_SESSIONS: 1
      E2E_ROLLBACK: 1
      FRANKENPHP_LOOP_MAX: 0
      ASSETS_DIR: ${E2E_ASSETS_DIR:-build-e2e}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/app_e2e?serverVersion=18&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
    volumes:
      - ./:/app

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s
    volumes:
      - database_data:/var/lib/postgresql:rw

volumes:
  database_data:
