# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(ASSETS_DIR): build

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    _instanceof:
        App\Application\Integration\SalesConnector:
            tags: ['app.sales_connector']

    App\Application\Integration\Connectors:
        arguments: [!tagged_iterator app.sales_connector]

    App\Infrastructure\Connector\SumUp\SumUpGateway: '@App\Infrastructure\Connector\SumUp\SumUpApiGateway'
    App\Infrastructure\Connector\Etsy\EtsyGateway: '@App\Infrastructure\Connector\Etsy\EtsyApiGateway'

    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - !service { class: PDO, factory: ['@doctrine.dbal.default_connection', 'getNativeConnection'] }
            - { lock_mode: !php/const Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler::LOCK_NONE }

when@test:
    services:
        App\Infrastructure\Connector\SumUp\SumUpGateway: '@App\Infrastructure\Connector\SumUp\FakeSumUpGateway'
        App\Infrastructure\Connector\SumUp\FakeSumUpGateway:
            autowire: true
            public: true
        App\Infrastructure\Connector\Etsy\EtsyGateway: '@App\Infrastructure\Connector\Etsy\FakeEtsyGateway'
        App\Infrastructure\Connector\Etsy\FakeEtsyGateway:
            autowire: true
            public: true
        App\Tests\Support\EndToEndSessionStorageFactory:
            arguments:
                $mock: '@session.storage.factory.mock_file'
                $native: '@session.storage.factory.native'
                $useNative: '%env(bool:default::E2E_NATIVE_SESSIONS)%'

