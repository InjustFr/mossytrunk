security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            id: App\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            entry_point: App\Presentation\Web\Security\AuthenticationEntryPoint
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                default_target_path: dashboard
                username_parameter: email
                password_parameter: password
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                signature_properties: [password]
            logout:
                path: logout
                target: login
                enable_csrf: true
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/password, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
